<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동양생명 보험 상담 AI API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .status {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            display: inline-block;
            margin: 20px 0;
            font-weight: bold;
        }
        .api-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .endpoint {
            font-family: 'Courier New', monospace;
            background: #e8e8e8;
            padding: 5px 10px;
            border-radius: 5px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 동양생명 보험 상담 AI</h1>
        <div class="status">✅ API 서버 정상 작동 중</div>
        
        <div class="api-info">
            <h3>📋 API 엔드포인트</h3>
            <div class="endpoint">POST /api/chat/question - 보험 질의응답</div>
            <div class="endpoint">GET /health - 서버 상태 확인</div>
            <div class="endpoint">GET /docs - API 문서 (Swagger)</div>
        </div>
        
        <p>이 서버는 동양생명 보험 약관 기반 AI 상담 서비스를 제공합니다.</p>
        <p>프론트엔드 애플리케이션을 통해 서비스를 이용하세요.</p>
        
        <div style="margin-top: 30px; color: #666;">
            <small>Version 1.0.0 | FastAPI + ChromaDB + OpenAI GPT</small>
        </div>
    </div>
</body>
</html>

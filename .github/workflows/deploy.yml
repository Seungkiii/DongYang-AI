name: Deploy AI Service to EC2

on:
  push:
    branches: 
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Navigate to deployment directory
          cd /home/ubuntu/dongyang-chatbot
          
          # Login to GitHub Container Registry
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 기존 AI 컨테이너 완전 정리
          echo "=== 기존 AI 컨테이너 정리 ==="
          docker-compose down ai || true
          docker container rm -f dongyang-ai || true
          docker container prune -f
          
          # ChromaDB 데이터베이스 완전 초기화 (500 에러 해결)
          echo "=== ChromaDB 데이터베이스 초기화 ==="
          sudo rm -rf /var/lib/docker/volumes/dongyang-chatbot_ai_data/_data/* || true
          sudo mkdir -p /var/lib/docker/volumes/dongyang-chatbot_ai_data/_data
          sudo chmod 755 /var/lib/docker/volumes/dongyang-chatbot_ai_data/_data
          sudo chown -R 1000:1000 /var/lib/docker/volumes/dongyang-chatbot_ai_data/_data || true
          
          # 최신 이미지 풀 및 재시작
          echo "=== 최신 이미지 배포 ==="
          docker-compose pull ai
          docker-compose up -d ai
          
          # AI 서버 기동 대기 및 임베딩 재생성
          echo "=== AI 서버 기동 대기 ==="
          sleep 10
          
          # 임베딩 재생성 (ChromaDB 초기화 후 필수)
          echo "=== 임베딩 재생성 ==="
          docker exec dongyang-ai python -c "from app.services.embedding_service import EmbeddingService; EmbeddingService().create_embeddings()" || echo "임베딩 생성 실패 - 수동으로 재시도 필요"
          
          # Clean up unused images
          docker image prune -f 
          
          # 로그 확인
          echo "=== AI Service 로그 ==="
          docker-compose logs --tail=10 ai 